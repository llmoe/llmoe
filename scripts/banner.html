<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>LLmoe · original profile artwork</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff1f6; color: #b64074; }
.hero { width: 1200px; height: 400px; position: relative; overflow: hidden; border-radius: 22px; background: url('../assets/sakura-city.png') center / cover; }
.hero::after { content: ''; position: absolute; inset: 0; border: 1px solid #dc8cad40; border-radius: inherit; pointer-events: none; }
.hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg,#fff8fbaa,transparent 65%); }
.copy { position: absolute; left: 48px; top: 44px; }
.eyebrow { font: 14px 'Menlo',monospace; letter-spacing: 2px; color: #ad4774; display: flex; align-items: center; gap: 12px; }
.signal { width: 8px; height: 8px; background: #de76a2; transform: rotate(-45deg); position: relative; }
.signal::before,.signal::after { content: ''; width: 8px; height: 8px; background: #de76a2; border-radius: 50%; position: absolute; }
.signal::before { top: -4px; left: 0; }
.signal::after { left: 4px; top: 0; }
h1 { margin: 22px 0 -6px; font: 128px/.98 'Arial Rounded MT Bold','Avenir Next',sans-serif; letter-spacing: -5px; text-shadow: 3px 3px #fffafad9; }
.byline { margin: 25px 0 23px; font: 16px 'Menlo',monospace; letter-spacing: 3px; color: #8c5672; }
.tag { display: inline-block; border: 1px solid #e3b1c4; border-radius: 20px; padding: 7px 14px; background: #fffafac9; font: 16px 'PingFang SC',sans-serif; letter-spacing: 1px; color: #86516a; }
.serial { position: absolute; left: 48px; bottom: 27px; font: 10px 'Menlo',monospace; letter-spacing: 2px; color: #986a80; }
.serial b { color: #cd568b; font-weight: 400; }
.corner { position: absolute; right: 19px; bottom: 19px; width: 20px; height: 20px; border-right: 2px solid #db8cac; border-bottom: 2px solid #db8cac; border-radius: 0 0 10px 0; }
.hero.mobile { width: 800px; height: 420px; }
.hero.mobile .copy { left: 30px; top: 58px; }
.hero.mobile h1 { font-size: 104px; margin-top: 22px; }
.hero.mobile .eyebrow { font-size: 10px; letter-spacing: 2px; }
.hero.mobile .byline { font-size: 13px; letter-spacing: 2px; }
.hero.mobile .tag { font-size: 12px; letter-spacing: 0; }
.hero.mobile .serial { left: 30px; font-size: 8px; }
.terminal { width: 800px; height: 98px; background: #fff1f7; display: flex; align-items: center; border: 1px solid #e8b7cc; border-radius: 16px; position: relative; overflow: hidden; font: 21px 'Menlo',monospace; }
.terminal::before { content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: #df8aaf; }
.prompt { margin-left: 36px; color: #b64074; }
.command { color: #79516b; margin-left: 16px; }
.cursor { margin-left: 4px; display: inline-block; height: 25px; width: 11px; background: #df6ca0; border-radius: 3px; }
.dots { display: flex; gap: 7px; position: absolute; right: 28px; top: 20px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: #e9bad0; }
.dots i:first-child { background: #df6ca0; }
.dots i:last-child { background: #b8a2d1; }
.lower { position: absolute; left: 36px; bottom: 14px; color: #a77891; font: 10px 'Menlo',monospace; letter-spacing: 2px; }
.pixel-cat { position: absolute; right: 28px; top: 39px; width: 44px; height: 34px; color: #b64074; }
</style>
<section class="hero">
  <div class="copy">
    <div class="eyebrow"><i class="signal"></i> HELLO, WORLD / こんにちは</div>
    <h1>LLmoe</h1>
    <p class="byline">CODE. CREATE. PLAY.</p>
    <div class="tag">写代码，也创造一点有趣的东西。</div>
  </div>
  <div class="serial"><b>♡</b> A LITTLE CODE. A LITTLE MAGIC.</div>
  <div class="corner"></div>
</section>
<section class="terminal">
  <span class="prompt">llmoe ~ $</span><span class="command">Code. Create. Play.</span><span class="cursor"></span>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="lower">A COZY LITTLE CORNER OF THE INTERNET</div>
  <svg class="pixel-cat" viewBox="0 0 44 34" aria-hidden="true"><path d="M7 13 5 3l11 7a23 23 0 0 1 12 0l11-7-2 10c7 14-1 19-15 19S0 27 7 13Z" fill="#ffe0ed" stroke="#c2648d" stroke-width="1.5" stroke-linejoin="round"/><path d="m11 21 3-2 3 2m10 0 3-2 3 2m-14 5 3 2 3-2" fill="none" stroke="#b64074" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="10" cy="25" rx="3" ry="1.5" fill="#ee9dbb"/><ellipse cx="34" cy="25" rx="3" ry="1.5" fill="#ee9dbb"/></svg>
</section>
<script>
window.setFrame = function(frame) {
  const phrases = ['Code. Create. Play.', 'Make cute little things.', 'Stay curious, stay cozy.'];
  const cycle = 45;
  const phase = frame % cycle;
  const phrase = phrases[Math.floor(frame / cycle) % phrases.length];
  const length = phase < 24 ? Math.ceil(phrase.length * phase / 24) : phase < 38 ? phrase.length : Math.floor(phrase.length * (45 - phase) / 7);
  document.querySelector('.command').textContent = phrase.slice(0, length);
  document.querySelector('.cursor').style.opacity = phase < 24 || phase >= 38 || phase % 8 < 4 ? 1 : 0;
  document.querySelector('.pixel-cat').style.transform = 'translateY(' + (Math.floor(frame / 8) % 2 ? -2 : 0) + 'px)';
};
</script>
</html>
