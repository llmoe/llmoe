.cheer.mobile{width:800px;height:190px}.cheer.mobile .cheer-copy{left:34px;top:40px}.cheer.mobile .cheer-label{font-size:17px;letter-spacing:1.5px;margin-bottom:22px}.cheer.mobile .message{font-size:32px}.cheer.mobile .lights{right:18px;top:43px;width:155px;height:120px}

  </svg>
</section>
<script>
window.setFrame=function(frame){
  const messages=['今天也要做一点喜欢的东西。♡','给喜欢的事，留一点发光的时间。','代码、灵感，还有 μ\'s 的日常。♪'];
  document.querySelector('.message').textContent=messages[Math.floor(frame/45)%messages.length];
  const wave=Math.sin(frame*Math.PI*2/45);
  document.querySelector('.pink-stick').style.transform='rotate('+(-14+wave*9)+'deg)';
  document.querySelector('.blue-stick').style.transform='rotate('+(13-wave*9)+'deg)';
  document.querySelectorAll('.twinkle').forEach((star,index)=>{star.style.opacity=.68+(Math.sin(frame*Math.PI*2/60+index)+1)*.16});
};
window.setFrame(0);
</script>
